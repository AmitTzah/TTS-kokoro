[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-studio"
version = "2.0.0"
description = "Multi-engine desktop GUI for local TTS models"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "kokoro>=0.9.2",
    "torch>=2.0",
    "soundfile>=0.12",
    "pygame>=2.5",
    "requests>=2.28",
]

[project.optional-dependencies]
chatterbox = ["chatterbox-tts"]

[project.scripts]
tts-studio = "tts_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
