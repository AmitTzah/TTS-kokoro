[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-tts"
version = "1.0.0"
description = "Graphical interface for the Kokoro-82M text-to-speech model"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "soundfile>=0.12",
    "pygame>=2.5",
    "phonemizer>=3.0",
    "requests>=2.28",
    "scipy>=1.10",
    "munch>=4.0",
    "transformers>=4.30",
]

[project.scripts]
kokoro-tts = "kokoro_tts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
